<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><title>보험 가입자격 Badge Runtime</title>
<link rel="stylesheet" href="/public/assets/css/components/income-calculation-cards.css">
</head>
<body>
<pre id="result">RUNNING</pre>
<div class="modal fade show" id="dailyIncomeModal" style="display:block"><div class="modal-dialog modal-xl modal-dialog-scrollable"><form class="modal-content"><div class="modal-body"><aside id="dailyIncomeWorkerResult" class="daily-income-worker-result"><div id="host"></div></aside></div></form></div></div>
<main id="projectionHost"></main>
<script type="module">
import { incomeInstitutionCardsDto, renderIncomeCalculationCards } from '/public/assets/js/common/income-calculation-cards.js?v=20260831-income-cards-13';

const host = document.getElementById('host');
const result = document.getElementById('result');
const dto = { lines: [{
    key: 'NATIONAL_PENSION', name: '국민연금', applicationStatus: 'EXCLUDED', calculationStatus: 'CALCULATED',
    basisAmount: null, calculatedAmount: 0, finalAmount: 0, employerAmount: 0, difference: 0,
    editable: false, employerEditable: false, employeeOnly: false, employerOnly: false,
    eligibility: { statusCode: 'EXCLUDED', statusName: '적용 제외', reasonName: '', reasonDetail: '' },
}] };
const overlayCount = () => document.querySelectorAll('.insurance-eligibility-popover').length;
const snapshot = {};

renderIncomeCalculationCards(host, dto);
let badge = host.querySelector('.insurance-eligibility-badge');
snapshot.before = overlayCount();
snapshot.dom = {
    tag: badge?.tagName, role: badge?.getAttribute('role'), tabindex: badge?.getAttribute('tabindex'),
    status: badge?.dataset.statusCode, reason: badge?.dataset.reasonName, icon: Boolean(badge?.querySelector('.bi-info-circle')),
};
badge.dispatchEvent(new PointerEvent('pointerover', { bubbles: true }));
snapshot.pointer = { count: overlayCount(), text: document.querySelector('.insurance-eligibility-popover')?.textContent || '' };
badge.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
snapshot.escape = overlayCount();

renderIncomeCalculationCards(host, dto);
badge = host.querySelector('.insurance-eligibility-badge');
badge.querySelector('.insurance-eligibility-badge-icon').dispatchEvent(new MouseEvent('click', { bubbles: true }));
const clickedOverlay = document.querySelector('.insurance-eligibility-popover');
const clickedStyle = clickedOverlay ? getComputedStyle(clickedOverlay) : null;
const clickedRect = clickedOverlay?.getBoundingClientRect();
const clickedTopElement = clickedRect ? document.elementFromPoint(clickedRect.left + clickedRect.width / 2, clickedRect.top + clickedRect.height / 2) : null;
snapshot.rerenderClick = {
    count: overlayCount(), text: clickedOverlay?.textContent || '', verified: clickedOverlay?.dataset.displayVerified,
    detailsOpen: badge.closest('.insurance-eligibility-disclosure')?.open,
    display: clickedStyle?.display, visibility: clickedStyle?.visibility, opacity: clickedStyle?.opacity,
    position: clickedStyle?.position, zIndex: clickedStyle?.zIndex,
    rect: clickedRect ? { left: clickedRect.left, top: clickedRect.top, width: clickedRect.width, height: clickedRect.height } : null,
    topElementClass: clickedTopElement?.className || '',
};
document.body.dispatchEvent(new MouseEvent('click', { bubbles: true }));
snapshot.outsideClick = overlayCount();

badge.dispatchEvent(new FocusEvent('focusin', { bubbles: true }));
snapshot.focus = overlayCount();
host.dispatchEvent(new Event('hidden.bs.modal', { bubbles: true }));
snapshot.modalClose = overlayCount();
const fallbackDisclosure = badge.closest('.insurance-eligibility-disclosure').cloneNode(true);
fallbackDisclosure.removeAttribute('open');
document.body.append(fallbackDisclosure);
fallbackDisclosure.querySelector('summary').click();
snapshot.nativeFallback = {
    open: fallbackDisclosure.open,
    text: fallbackDisclosure.querySelector('.insurance-eligibility-fallback')?.textContent || '',
    display: getComputedStyle(fallbackDisclosure.querySelector('.insurance-eligibility-fallback')).display,
};
snapshot.controls = {
    restoreButtons: host.querySelectorAll('.income-calculation-restore').length,
    modeText: host.querySelector('.income-calculation-mode')?.textContent || '',
};
const projectionHost = document.getElementById('projectionHost');
const projectedDto = incomeInstitutionCardsDto([
    { line_type_code: 'DEDUCTION', line_code: 'NATIONAL_PENSION', application_status_code: 'EXCLUDED', calculated_amount: null, final_amount: 0,
        eligibility_snapshot: { result_code: 'NOT_ELIGIBLE', reason_code: 'CONTINUOUS_EMPLOYMENT_PERIOD_NOT_MET', reason_name: '계속고용기간 요건 미충족' } },
    { line_type_code: 'EMPLOYER_BURDEN', line_code: 'NATIONAL_PENSION', application_status_code: 'EXCLUDED', calculated_amount: null, final_amount: 0 },
    { line_type_code: 'EMPLOYER_BURDEN', line_code: 'INDUSTRIAL_ACCIDENT_INSURANCE', application_status_code: 'APPLICABLE', calculated_amount: 100, final_amount: 100,
        eligibility_snapshot: { result_code: 'ELIGIBLE', reason_name: '법정 가입요건 충족' } },
], { typeField: 'line_type_code', codeField: 'line_code', editable: () => true });
renderIncomeCalculationCards(projectionHost, projectedDto);
const pensionCard = projectionHost.querySelector('.income-calculation-card--national_pension');
const industrialCard = projectionHost.querySelector('.income-calculation-card--industrial_accident_insurance');
const industrialInput = industrialCard?.querySelector('.income-calculation-editor--employer input');
const industrialInitialRestoreCount = industrialCard?.querySelectorAll('.income-calculation-restore').length;
if (industrialInput) {
    industrialInput.value = '150';
    industrialInput.dispatchEvent(new Event('input', { bubbles: true }));
}
const industrialRestore = industrialCard?.querySelector('.income-calculation-editor--employer .income-calculation-restore');
const industrialChangedRestoreCount = industrialCard?.querySelectorAll('.income-calculation-restore').length;
industrialRestore?.click();
snapshot.projection = {
    pensionBadge: pensionCard?.querySelector('.insurance-eligibility-badge')?.textContent.trim(),
    pensionAmounts: [...(pensionCard?.querySelectorAll('dd') || [])].map(node => node.textContent.trim()),
    pensionRestoreButtons: pensionCard?.querySelectorAll('.income-calculation-restore').length,
    industrialEmployeeFields: industrialCard?.querySelectorAll('.income-calculation-editor:not(.income-calculation-editor--employer)').length,
    industrialInitialRestoreCount,
    industrialChangedRestoreCount,
    industrialRestoredValue: industrialInput?.value,
    industrialRestoredCount: industrialCard?.querySelectorAll('.income-calculation-restore').length,
};

const pass = snapshot.before === 0
    && snapshot.dom.tag === 'SUMMARY' && snapshot.dom.role === 'button' && snapshot.dom.tabindex === '0'
    && snapshot.dom.status === 'EXCLUDED' && snapshot.dom.reason === '판정 사유 확인 필요' && snapshot.dom.icon
    && snapshot.pointer.count === 1 && snapshot.pointer.text.includes('국민연금')
    && snapshot.pointer.text.includes('적용 제외') && snapshot.pointer.text.includes('판정 사유 확인 필요')
    && snapshot.escape === 0 && snapshot.rerenderClick.count === 1 && snapshot.rerenderClick.verified === 'true'
    && snapshot.rerenderClick.detailsOpen && snapshot.rerenderClick.display !== 'none' && snapshot.rerenderClick.visibility !== 'hidden'
    && snapshot.rerenderClick.rect.width > 0 && snapshot.rerenderClick.rect.height > 0
    && String(snapshot.rerenderClick.topElementClass).includes('insurance-eligibility-popover')
    && snapshot.outsideClick === 0 && snapshot.focus === 1 && snapshot.modalClose === 0
    && snapshot.nativeFallback.open && snapshot.nativeFallback.display !== 'none' && snapshot.nativeFallback.text.includes('국민연금')
    && snapshot.controls.restoreButtons === 0 && snapshot.controls.modeText.includes('적용 제외')
    && snapshot.projection.pensionBadge.includes('적용 제외') && snapshot.projection.pensionAmounts.includes('0원')
    && snapshot.projection.pensionAmounts.includes('미확정') === false && snapshot.projection.pensionRestoreButtons === 0
    && snapshot.projection.industrialEmployeeFields === 0
    && snapshot.projection.industrialInitialRestoreCount === 0 && snapshot.projection.industrialChangedRestoreCount === 1
    && snapshot.projection.industrialRestoredValue === '100' && snapshot.projection.industrialRestoredCount === 0;
result.dataset.pass = pass ? 'true' : 'false';
result.textContent = JSON.stringify({ pass, snapshot }, null, 2);
</script>
</body>
</html>
